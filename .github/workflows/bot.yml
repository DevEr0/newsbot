name: market-bot

on:
  schedule:
    - cron: "*/5 8-23 * * 1-5"   # UTC: covers US pre-market -> after-hours on weekdays, every 5 min (GitHub's minimum)
    - cron: "*/30 0-7 * * *"     # nights & weekends: every 30 min
  workflow_dispatch: {}          # "Run workflow" button for manual runs

concurrency:
  group: market-bot              # never two runs at once (they would fight over Telegram updates + state)
  cancel-in-progress: false

permissions:
  contents: write                # needed to save state.json to the `bot-state` branch

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Load state (kept on its own branch so main stays clean)
        run: |
          git fetch origin bot-state --depth=1 2>/dev/null && git show FETCH_HEAD:state.json > state.json || echo "no state yet (first run)"

      - name: Run bot
        run: python bot.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

      - name: Save state
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git worktree add --detach "$RUNNER_TEMP/st"
          cd "$RUNNER_TEMP/st"
          git checkout --orphan state-tmp
          git rm -rf --quiet . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/state.json" state.json
          git add state.json
          git commit --quiet -m "state"
          git push --quiet --force origin state-tmp:bot-state
